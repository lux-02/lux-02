<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a0505"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e53e3e"/>
      <stop offset="100%" style="stop-color:#9b1c1c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Red glow center -->
  <ellipse cx="300" cy="300" rx="200" ry="200" fill="#e53e3e" opacity="0.06"/>

  <!-- Shield shape -->
  <path d="M 300 100 L 420 140 L 420 270 Q 420 360 300 400 Q 180 360 180 270 L 180 140 Z"
        fill="url(#shieldGrad)" filter="url(#softglow)" opacity="0.95"/>
  <!-- Shield inner border -->
  <path d="M 300 120 L 403 156 L 403 268 Q 403 348 300 385 Q 197 348 197 268 L 197 156 Z"
        fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>

  <!-- Checkmark in shield -->
  <polyline points="240,270 285,315 360,225"
            fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)" opacity="0.95"/>

  <!-- Chrome ring (extension indicator) -->
  <circle cx="300" cy="250" r="155" fill="none" stroke="#e53e3e" stroke-width="3" stroke-dasharray="8 6" opacity="0.25"/>
  <circle cx="300" cy="250" r="175" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.12"/>

  <!-- Scan lines (threat analysis effect) -->
  <line x1="160" y1="200" x2="440" y2="200" stroke="#e53e3e" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="300" x2="440" y2="300" stroke="#e53e3e" stroke-width="1" opacity="0.15"/>

  <!-- Right side content -->
  <!-- ClickJeon title -->
  <text x="640" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="700"
        fill="white" letter-spacing="-2">클릭전</text>
  <text x="640" y="275" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="400"
        fill="#fc8181" letter-spacing="1">ClickJeon</text>

  <!-- Divider -->
  <line x1="640" y1="300" x2="1060" y2="300" stroke="#e53e3e" stroke-width="1.5" opacity="0.5"/>

  <!-- Tagline -->
  <text x="640" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e2e8f0" opacity="0.9">
    SEO Poisoning · Phishing Blocker
  </text>

  <!-- Feature badges -->
  <rect x="640" y="370" width="170" height="34" rx="17" fill="#e53e3e" opacity="0.2" stroke="#e53e3e" stroke-width="1" opacity="0.5"/>
  <text x="725" y="392" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#fc8181" text-anchor="middle">Chrome MV3</text>

  <rect x="825" y="370" width="160" height="34" rx="17" fill="#e53e3e" opacity="0.2" stroke="#e53e3e" stroke-width="1" opacity="0.5"/>
  <text x="905" y="392" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#fc8181" text-anchor="middle">AI 5-Level Risk</text>

  <rect x="640" y="418" width="155" height="34" rx="17" fill="#e53e3e" opacity="0.2" stroke="#e53e3e" stroke-width="1" opacity="0.5"/>
  <text x="717" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#fc8181" text-anchor="middle">Privacy-First</text>

  <rect x="810" y="418" width="180" height="34" rx="17" fill="#e53e3e" opacity="0.2" stroke="#e53e3e" stroke-width="1" opacity="0.5"/>
  <text x="900" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#fc8181" text-anchor="middle">Open Source</text>

  <!-- Bottom URL -->
  <text x="640" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#718096">
    clickjeon.n2f.site
  </text>
  <text x="640" y="540" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#4a5568">
    Chrome Web Store 심사 중 (2026.05)
  </text>

  <!-- Vertical separator -->
  <line x1="530" y1="60" x2="530" y2="540" stroke="#e53e3e" stroke-width="1" opacity="0.2"/>
</svg>
